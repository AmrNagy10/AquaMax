name: AquaMax
description: Smart Water Quality Monitor

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_blue_plus: ^1.31.7
  http: ^1.6.0
  image_picker: ^1.0.7
  permission_handler: ^11.3.0
  provider: ^6.1.2
  fl_chart: ^0.69.0
  shared_preferences: ^2.3.2
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo.png"
  min_sdk_version: 21 # عشان تتجنب أي مشاكل مع الأندرويد القديم
  
flutter:
  uses-material-design: true
